{% extends 'baseheader.html' %}
{% load static %}

{% block head %}
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
{% endblock %}

{% block title %}Мойдневник - Главная{% endblock %}

{% block content %}
    <div class="centerdiv centerpadding">
        <h1>Мой дневник</h1>
        {% if request.user.is_authenticated %}
            <a class="button" href="{% url 'profile' %}">Профиль</a>
        {% else %}
            <a class="button" href="{% url 'login' %}">Вход</a>
        {% endif %}
    </div>
{% endblock %}
