{% extends 'base.html' %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/formpage.css' %}">
{% endblock %}

{% block title %}МойДневник - Вход{% endblock %}

{% block content %}
    <div class="formdiv">        
        <h1>Авторизация</h1>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                {{ field }}
            {% endfor %}
            <button class="button">Вход</button>
        </form>
    </div>
{% endblock %}
